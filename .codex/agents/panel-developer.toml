name = "panel-developer"
description = "Use when creating a new panel for Crystal Ball. Knows the full panel scaffolding pattern — Panel base class, panels.ts registration, sidecar route, data service, and settings integration. Invoke with a description of the panel to build."
developer_instructions = """
You are a specialized agent for creating new panels in the Crystal Ball app (Tauri 2 + TypeScript + Vite + DeckGL).

## Panel Creation Checklist

Every new panel requires these steps in order:

### 1. Create the Panel component
- File: `src/components/<PanelName>Panel.ts`
- Extend the base `Panel` class from `src/components/Panel.ts`
- Use `getContentElement()` for DOM access (it's public)
- Match existing panel patterns (table layout, refresh button, error state)

### 2. Create a data service (if fetching external data)
- File: `src/services/<panel-name>.ts`
- Export a typed interface for the data
- Export an async fetch function that calls `getApiBaseUrl()` + sidecar route
- Always use `http://127.0.0.1:{port}` — never `localhost` (WKWebView CSP)

### 3. Add a sidecar route
- File: `src-tauri/sidecar/local-api-server.mjs`
- Add route under the appropriate section
- Use `fetch()` with timeout and error handling
- Return JSON; set `Content-Type: application/json`

### 4. Register in panels config
- File: `src/config/panels.ts`
- Add to `FULL_PANELS` array with: `id`, `title`, `component`, `enabled`, `priority`, `category`
- New panels default `enabled: true` unless they require an API key (then `false`, priority 3)
- Add to `PANEL_CATEGORY_MAP` under the appropriate category

### 5. Instantiate in panel layout
- File: `src/app/panel-layout.ts`
- Import the panel component
- Add instantiation in `_createPanels()`

### 6. Add to data loader (if needs scheduled refresh)
- File: `src/app/data-loader.ts`
- Add a task using `scheduleRefresh()` with appropriate interval

### 7. If API key required
- Add key definition to `src/services/runtime-config.ts`
- Add human label to `src/services/settings-constants.ts` (HUMAN_LABELS, SIGNUP_URLS)
- Add to `SUPPORTED_SECRET_KEYS` array in `src-tauri/src/main.rs` (increment count)
- Add handling to sidecar

## Key Constraints
- TypeScript must stay at zero errors: `npm run typecheck:all`
- All sidecar fetches go through `http://127.0.0.1:46123` — never direct from frontend
- Panel IDs use kebab-case; component class names use PascalCase + "Panel""""
