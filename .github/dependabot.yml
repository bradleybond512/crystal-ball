version: 2
updates:
  # npm — frontend and dev tooling
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # R4-SEC-002 step 3: let a hijacked release be caught and pulled before
    # it is proposed. Security updates are not delayed by cooldowns.
    cooldown:
      default-days: 7
      semver-major-days: 14
    ignore:
      # TypeScript 7 (the native "tsgo" port) changes internal APIs that
      # @typescript-eslint/typescript-estree reads, crashing the lint pass
      # ("Cannot read properties of undefined (reading 'Cjs')"). typescript-eslint's
      # peer range is still `<6.1.0` at latest (8.65.0) AND canary (8.65.1-alpha.11),
      # so no release supports TS7 yet. 6.x updates still flow.
      # REMOVE this ignore once typescript-eslint ships TS7 support, then take the
      # bump together with a matching typescript-eslint upgrade + tsconfig migration.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      dev-tooling:
        patterns:
          - "typescript"
          - "vite*"
          - "@types/*"
          - "esbuild"
          - "tsx"
      tauri-cli:
        patterns:
          - "@tauri-apps/*"

  # Cargo — Rust / Tauri backend
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    # R4-SEC-002 step 3: let a hijacked release be caught and pulled before
    # it is proposed. Security updates are not delayed by cooldowns.
    cooldown:
      default-days: 7
      semver-major-days: 14

  # GitHub Actions — pin to hashed commits for supply-chain safety
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    # R4-SEC-002 step 3: let a hijacked release be caught and pulled before
    # it is proposed. Security updates are not delayed by cooldowns.
    cooldown:
      default-days: 7

  # pip — CI tool pins (zizmor), version- and hash-locked
  - package-ecosystem: "pip"
    directory: "/.github/tools/zizmor"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    # R4-SEC-002 step 3: let a hijacked release be caught and pulled before
    # it is proposed. Security updates are not delayed by cooldowns.
    cooldown:
      default-days: 7
      semver-major-days: 14
