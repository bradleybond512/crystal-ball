name: Actionlint

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.8

  # R4-LOW-002: GitHub Actions security audit (template injection, excessive
  # permissions, cache poisoning, dangerous triggers, ...). High-severity
  # findings fail the build. zizmor is installed from a version- AND
  # hash-pinned requirements file; Dependabot proposes updates with cooldown.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install zizmor (pinned by version and hash)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --require-hashes --only-binary=:all: -r .github/tools/zizmor/requirements.txt
      - name: Audit workflows
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --offline --min-severity high --format github .github/workflows'
