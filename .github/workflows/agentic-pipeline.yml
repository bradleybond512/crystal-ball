name: Agentic engineering pipeline

on:
  workflow_dispatch:
    inputs:
      request:
        description: Engineering request (required for a new run)
        required: false
        type: string
      branch:
        description: Existing codex/* branch to update
        required: true
        default: codex/agentic-run
        type: string
      resume_run_id:
        description: Prior workflow run ID to resume
        required: false
        type: string
      pipeline_id:
        description: Pipeline ID from the prior run
        required: false
        type: string
      approval_gate:
        description: Durable approval to record before resume
        required: true
        default: none
        type: choice
        options:
          - none
          - design
          - control_plane
          - release
          - deploy
          - secrets
          - destructive
      max_total_tokens:
        description: Hard token budget
        required: true
        default: "250000"
        type: string
      max_invocations:
        description: Hard model-invocation budget
        required: true
        default: "12"
        type: string
      publish_changes:
        description: Commit, push, and update the draft PR after all gates pass
        required: true
        default: false
        type: boolean
      draft_pr_number:
        description: Existing draft PR number to update after approved publish
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: agentic-pipeline-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  run:
    name: Route, build, validate, review
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      outcome: ${{ steps.pipeline.outputs.outcome }}
      pipeline_id: ${{ steps.pipeline.outputs.pipeline_id }}
    env:
      CONTROL_ROOT: ${{ github.workspace }}/control-plane
      TARGET_ROOT: ${{ github.workspace }}/agent-worktree
      RUN_ROOT: ${{ github.workspace }}/.agentic-run
      PIPELINE_STATE: ${{ github.workspace }}/.agentic-run/state.sqlite
      TARGET_BRANCH: ${{ inputs.branch }}
      PIPELINE_ACTOR: ${{ github.actor }}
    steps:
      - name: Validate dispatch
        env:
          REQUEST: ${{ inputs.request }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          PIPELINE_ID: ${{ inputs.pipeline_id }}
          WORKFLOW_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git check-ref-format --branch "$TARGET_BRANCH"
          if [[ "$WORKFLOW_REF" != "$DEFAULT_BRANCH" ]]; then
            echo "Run this workflow from the protected default branch." >&2
            exit 1
          fi
          if [[ "$TARGET_BRANCH" != codex/* ]]; then
            echo "The pipeline only writes codex/* branches." >&2
            exit 1
          fi
          if [[ -z "$RESUME_RUN_ID" && -z "$REQUEST" ]]; then
            echo "request is required for a new run." >&2
            exit 1
          fi
          if [[ -n "$RESUME_RUN_ID" && -z "$PIPELINE_ID" ]]; then
            echo "pipeline_id is required when resuming." >&2
            exit 1
          fi

      - name: Checkout protected control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control-plane
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout mutable target worktree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.branch }}
          path: agent-worktree
          fetch-depth: 0
          persist-credentials: false

      - name: Restore prior durable state
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: agentic-pipeline-state
          path: .agentic-resume
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Install locked application dependencies
        working-directory: agent-worktree
        run: npm ci --ignore-scripts

      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.145.0

      - name: Restore worktree and ledger
        if: inputs.resume_run_id != ''
        run: |
          mkdir -p "$RUN_ROOT"
          cp .agentic-resume/state.sqlite "$PIPELINE_STATE"
          expected_control_sha="$(cat .agentic-resume/control-sha)"
          git -C "$CONTROL_ROOT" fetch --depth=1 origin \
            "$expected_control_sha"
          git -C "$CONTROL_ROOT" checkout --detach "$expected_control_sha"
          if [[ -s .agentic-resume/workspace.patch ]]; then
            git -C "$TARGET_ROOT" apply --whitespace=error \
              .agentic-resume/workspace.patch
          fi

      - name: Run or resume protected pipeline
        id: pipeline
        env:
          REQUEST: ${{ inputs.request }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          PIPELINE_ID: ${{ inputs.pipeline_id }}
          APPROVAL_GATE: ${{ inputs.approval_gate }}
          MAX_TOTAL_TOKENS: ${{ inputs.max_total_tokens }}
          MAX_INVOCATIONS: ${{ inputs.max_invocations }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p "$RUN_ROOT"
          pipeline=(
            python3 -m tools.agentic_pipeline
            --root "$TARGET_ROOT"
            --control-root "$CONTROL_ROOT"
            --state "$PIPELINE_STATE"
          )
          cd "$CONTROL_ROOT"
          if [[ -n "$RESUME_RUN_ID" ]]; then
            if [[ "$APPROVAL_GATE" != "none" ]]; then
              "${pipeline[@]}" approve "$PIPELINE_ID" \
                --gate "$APPROVAL_GATE" --actor "$PIPELINE_ACTOR"
            fi
            set +e
            result="$("${pipeline[@]}" resume "$PIPELINE_ID" --json)"
            pipeline_exit=$?
            set -e
          else
            set +e
            result="$("${pipeline[@]}" start \
              --request "$REQUEST" \
              --branch "$TARGET_BRANCH" \
              --max-total-tokens "$MAX_TOTAL_TOKENS" \
              --max-invocations "$MAX_INVOCATIONS" \
              --json)"
            pipeline_exit=$?
            set -e
            PIPELINE_ID="$(python3 -c \
              'import json,sys; print(json.load(sys.stdin)["pipeline_id"])' \
              <<<"$result")"
          fi
          printf '%s\n' "$PIPELINE_ID" > "$RUN_ROOT/pipeline-id"
          printf 'pipeline_id=%s\n' "$PIPELINE_ID" >> "$GITHUB_OUTPUT"
          if [[ "$pipeline_exit" -eq 0 ]]; then
            printf 'outcome=completed\n' >> "$GITHUB_OUTPUT"
          elif [[ "$pipeline_exit" -eq 10 ]]; then
            printf 'outcome=waiting_approval\n' >> "$GITHUB_OUTPUT"
          else
            printf 'outcome=blocked\n' >> "$GITHUB_OUTPUT"
          fi
          "${pipeline[@]}" summary "$PIPELINE_ID" \
            --output "$RUN_ROOT/summary.md"
          cat "$RUN_ROOT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$pipeline_exit" -ne 0 && "$pipeline_exit" -ne 10 ]]; then
            exit "$pipeline_exit"
          fi

      - name: Package resumable state
        if: always()
        working-directory: agent-worktree
        run: |
          mkdir -p "$RUN_ROOT"
          git -C "$CONTROL_ROOT" rev-parse HEAD > "$RUN_ROOT/control-sha"
          git ls-files --others --exclude-standard -z \
            > "$RUN_ROOT/untracked-paths"
          if [[ -s "$RUN_ROOT/untracked-paths" ]]; then
            git add -N \
              --pathspec-from-file="$RUN_ROOT/untracked-paths" \
              --pathspec-file-nul
          fi
          git diff --binary > "$RUN_ROOT/workspace.patch"
          if ! git diff --quiet HEAD -- scripts/secret-scan.mjs; then
            echo "Secret scanner changed; worktree patch omitted." \
              >> "$RUN_ROOT/summary.md"
            : > "$RUN_ROOT/workspace.patch"
          elif ! node "$CONTROL_ROOT/scripts/secret-scan.mjs"; then
            echo "Secret scan failed; worktree patch omitted." \
              >> "$RUN_ROOT/summary.md"
            : > "$RUN_ROOT/workspace.patch"
          fi

      - name: Upload durable state and worktree patch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agentic-pipeline-state
          path: |
            .agentic-run/state.sqlite
            .agentic-run/workspace.patch
            .agentic-run/pipeline-id
            .agentic-run/control-sha
            .agentic-run/summary.md
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish approved completed change
    needs: run
    if: needs.run.outputs.outcome == 'completed' && inputs.publish_changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      CONTROL_ROOT: ${{ github.workspace }}/control-plane
      TARGET_ROOT: ${{ github.workspace }}/agent-worktree
      PUBLISH_ROOT: ${{ github.workspace }}/.agentic-publish
      PIPELINE_STATE: ${{ github.workspace }}/.agentic-publish/state.sqlite
      TARGET_BRANCH: ${{ inputs.branch }}
      PIPELINE_ACTOR: ${{ github.actor }}
      PIPELINE_ID: ${{ needs.run.outputs.pipeline_id }}
    steps:
      - name: Checkout protected control plane
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control-plane
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout mutable target worktree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.branch }}
          path: agent-worktree
          fetch-depth: 0
          persist-credentials: false

      - name: Download reviewed pipeline artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: agentic-pipeline-state
          path: .agentic-publish

      - name: Apply reviewed worktree patch
        run: |
          if [[ -s "$PUBLISH_ROOT/workspace.patch" ]]; then
            git -C "$TARGET_ROOT" apply --whitespace=error \
              "$PUBLISH_ROOT/workspace.patch"
          fi

      - name: Record explicit publish approval
        working-directory: control-plane
        run: |
          python3 -m tools.agentic_pipeline \
            --root "$TARGET_ROOT" \
            --control-root "$CONTROL_ROOT" \
            --state "$PIPELINE_STATE" \
            approve "$PIPELINE_ID" \
            --gate publish \
            --actor "$PIPELINE_ACTOR"

      - name: Commit reviewed change
        working-directory: agent-worktree
        run: |
          {
            git diff --name-only -z
            git ls-files --others --exclude-standard -z
          } > "$PUBLISH_ROOT/changed-paths"
          if [[ ! -s "$PUBLISH_ROOT/changed-paths" ]]; then
            echo "No changes to publish."
            exit 0
          fi
          git add \
            --pathspec-from-file="$PUBLISH_ROOT/changed-paths" \
            --pathspec-file-nul
          git config user.name "Crystal Ball Agentic Pipeline"
          git config user.email "actions@users.noreply.github.com"
          git commit \
            -m "build(codex): execute approved agentic task" \
            -m "Co-Authored-By: Codex Sonnet 4.6 <noreply@anthropic.com>"

      - name: Push approved branch
        working-directory: agent-worktree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git remote add fork "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git push fork "HEAD:${TARGET_BRANCH}"

      - name: Update approved draft PR
        if: inputs.draft_pr_number != ''
        working-directory: control-plane
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.draft_pr_number }}
        run: |
          python3 -m tools.agentic_pipeline \
            --root "$TARGET_ROOT" \
            --control-root "$CONTROL_ROOT" \
            --state "$PIPELINE_STATE" \
            pr-update "$PIPELINE_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER"
