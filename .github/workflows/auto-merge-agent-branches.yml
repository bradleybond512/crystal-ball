name: Agent publication notices and merge safety

on:
  push:
    branches:
      - 'claude/**'
      - 'codex/**'
      - 'copilot/**'
      - 'feat/**'
      - 'fix/**'
      - 'ui/**'
      - 'chore/**'
      - 'perf/**'
      - 'docs/**'

permissions:
  contents: read

# Push values and step outputs remain data, never executable script source.
jobs:
  auto-pr:
    name: Report PR and apply branch labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr_number: ${{ steps.create-pr.outputs.pr_number }}
      pr_node_id: ${{ steps.create-pr.outputs.pr_node_id }}
    steps:
      - name: Report explicit pull request publication
        id: create-pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          BRANCH: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.BRANCH;
            const repository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const sameRepository = value => typeof value === 'string' && value.toLowerCase() === repository;
            const validSha = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
            if (!branch || branch.length > 1024 || /[\0\r\n]/.test(branch) || !validSha(context.sha)) {
              core.setFailed('PR lookup has invalid push metadata.');
              return;
            }
            let response;
            try {
              response = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch}`,
                base: 'main',
                state: 'open',
                per_page: 2,
                page: 1
              });
            } catch (error) {
              const status = Number.isInteger(error?.status) && error.status >= 100 && error.status <= 599 ? `HTTP ${error.status}` : 'unknown status';
              core.setFailed(`PR lookup failed (${status}).`);
              return;
            }
            const prs = response?.data;
            const link = response?.headers?.link;
            if (!Array.isArray(prs) || prs.length > 1 || (link !== undefined && (typeof link !== 'string' || /rel\s*=\s*"?next\b/i.test(link)))) {
              core.setFailed('PR lookup returned malformed, ambiguous or truncated results.');
              return;
            }
            if (prs.length === 0) {
              core.notice('No matching open PR was found at this check. Publish a draft PR explicitly after approval.');
              return;
            }
            const pr = prs[0];
            if (!pr || !Number.isSafeInteger(pr.number) || pr.number < 1 || typeof pr.node_id !== 'string' || !/^[A-Za-z0-9_+/=-]{1,256}$/.test(pr.node_id)
              || pr.state !== 'open' || typeof pr.draft !== 'boolean' || pr.head?.ref !== branch || !validSha(pr.head?.sha)
              || pr.base?.ref !== 'main' || !sameRepository(pr.head?.repo?.full_name) || !sameRepository(pr.base?.repo?.full_name)) {
              core.setFailed('PR lookup returned a malformed or mismatched pull request.');
              return;
            }
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('pr_node_id', pr.node_id);
            const readiness = pr.draft ? 'draft' : 'ready';
            if (pr.head.sha === context.sha) {
              core.info(`Existing ${readiness} PR #${pr.number} contains this push; body and readiness are unchanged.`);
            } else {
              core.warning(`Existing ${readiness} PR #${pr.number} has a head SHA that does not match this push; body and readiness are unchanged.`);
            }

      - name: Label PR by branch prefix
        if: steps.create-pr.outputs.pr_number != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          BRANCH: ${{ github.ref_name }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.BRANCH;
            const prNumber = Number(process.env.PR_NUMBER);
            if (!branch || !/^[1-9][0-9]*$/.test(process.env.PR_NUMBER ?? '') || !Number.isSafeInteger(prNumber)) {
              core.setFailed('PR labeling has invalid pull request metadata.');
              return;
            }
            const labelMap = {
              'claude/': ['ai-generated', 'claude'],
              'codex/': ['ai-generated', 'codex'],
              'copilot/': ['ai-generated', 'copilot'],
              'feat/': ['feature'],
              'fix/': ['bug'],
              'ui/': ['ui'],
              'chore/': ['chore'],
              'perf/': ['performance'],
              'docs/': ['documentation']
            };
            const labels = Object.entries(labelMap).find(([prefix]) => branch.startsWith(prefix))?.[1];
            if (!labels) return;
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels
              });
            } catch (error) {
              const status = Number.isInteger(error?.status) && error.status >= 100 && error.status <= 599 ? `HTTP ${error.status}` : 'unknown status';
              core.setFailed(`PR labeling failed (${status}).`);
            }

  auto-merge:
    name: Disable auto-merge for sensitive changes
    needs: auto-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: ${{ !cancelled() && needs.auto-pr.outputs.pr_number != '' && (startsWith(github.ref_name, 'claude/') || startsWith(github.ref_name, 'codex/') || startsWith(github.ref_name, 'copilot/') || startsWith(github.ref_name, 'feat/') || startsWith(github.ref_name, 'fix/') || startsWith(github.ref_name, 'chore/')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Defense in depth; dependency-change-gate.yml is the binding base-branch
      # check. Any policy error counts as sensitive.
      - name: Detect dependency or CI-policy changes
        id: policy
        shell: bash
        run: |
          if git diff --name-only origin/main...HEAD | node scripts/dependency-change-policy.mjs --stdin; then
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Turn auto-merge off for a sensitive PR
        if: steps.policy.outputs.sensitive == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          BRANCH: ${{ github.ref_name }}
          PR_NUMBER: ${{ needs.auto-pr.outputs.pr_number }}
          PR_NODE_ID: ${{ needs.auto-pr.outputs.pr_node_id }}
        with:
          github-token: ${{ secrets.AUTO_MERGE_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.BRANCH;
            const id = process.env.PR_NODE_ID;
            const number = Number(process.env.PR_NUMBER);
            const repository = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            const sameRepository = value => typeof value === 'string' && value.toLowerCase() === repository;
            if (!branch || !/^[1-9][0-9]*$/.test(process.env.PR_NUMBER ?? '') || !Number.isSafeInteger(number)
              || typeof id !== 'string' || !/^[A-Za-z0-9_+/=-]{1,256}$/.test(id)) {
              core.setFailed('Sensitive PR protection has invalid pull request metadata.');
              return;
            }
            let observed;
            try {
              observed = await github.graphql(
                'query($id: ID!) { node(id: $id) { __typename ... on PullRequest { id number state headRefName baseRefName headRepository { nameWithOwner } repository { nameWithOwner } autoMergeRequest { enabledAt } } } }',
                { id }
              );
            } catch (error) {
              const status = Number.isInteger(error?.status) && error.status >= 100 && error.status <= 599 ? `HTTP ${error.status}` : 'unknown status';
              core.setFailed(`Sensitive PR auto-merge state lookup failed (${status}).`);
              return;
            }
            const pr = observed?.node;
            if (!pr || pr.__typename !== 'PullRequest' || pr.id !== id || pr.number !== number || pr.state !== 'OPEN'
              || pr.headRefName !== branch || pr.baseRefName !== 'main'
              || !sameRepository(pr.headRepository?.nameWithOwner) || !sameRepository(pr.repository?.nameWithOwner)
              || (pr.autoMergeRequest !== null && (typeof pr.autoMergeRequest?.enabledAt !== 'string' || !Number.isFinite(Date.parse(pr.autoMergeRequest.enabledAt))))) {
              core.setFailed('Sensitive PR auto-merge lookup returned malformed or mismatched evidence.');
              return;
            }
            if (pr.autoMergeRequest === null) {
              core.info(`PR #${number} has auto-merge off at this check.`);
              return;
            }
            try {
              const result = await github.graphql(
                'mutation($id: ID!) { disablePullRequestAutoMerge(input: { pullRequestId: $id }) { pullRequest { id number autoMergeRequest { enabledAt } } } }',
                { id }
              );
              const updated = result?.disablePullRequestAutoMerge?.pullRequest;
              if (updated?.id !== id || updated?.number !== number || updated?.autoMergeRequest !== null) {
                core.setFailed('Sensitive PR auto-merge disablement was not confirmed.');
                return;
              }
              core.info(`PR #${number} auto-merge is confirmed off after sensitive-change protection.`);
            } catch (error) {
              const status = Number.isInteger(error?.status) && error.status >= 100 && error.status <= 599 ? `HTTP ${error.status}` : 'unknown status';
              core.setFailed(`Sensitive PR auto-merge disablement failed (${status}); off state is unconfirmed.`);
            }
