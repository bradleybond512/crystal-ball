name: Auto-update PR branches

# Keeps the merge queue draining itself. GitHub's auto-merge only fires when a
# PR is green AND up to date with main; with several PRs open, each merge pushes
# the others "behind" and they stall. On every push to main this updates the
# branch of every open auto-merge-enabled PR so it becomes current again, its
# checks re-run, and auto-merge fires — cascading until the queue is empty.
#
# Pairs with auto-merge-agent-branches.yml (which enables auto-merge). For this
# to do anything, those PRs must have auto-merge enabled, which needs the
# AUTO_MERGE_PAT secret (see that workflow's notes).

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update-branches:
    name: Update auto-merge PRs to head of main
    runs-on: ubuntu-latest
    steps:
      - name: Update each auto-merge-enabled PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          # Prefer a PAT/App token so updates work even where the default
          # GITHUB_TOKEN is restricted; fall back to GITHUB_TOKEN otherwise.
          github-token: ${{ secrets.AUTO_MERGE_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'main',
              state: 'open',
              per_page: 100,
            });
            // Only touch PRs that are actually queued to auto-merge and aren't
            // drafts — leave everything else alone.
            const targets = prs.filter((pr) => pr.auto_merge && !pr.draft);
            if (targets.length === 0) {
              core.info('No auto-merge-enabled PRs to update.');
              return;
            }
            for (const pr of targets) {
              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                core.info(`Updated #${pr.number} (${pr.head.ref}) to head of main.`);
              } catch (err) {
                const msg = String((err && err.message) || err);
                // 422 "already up to date" is the normal no-op once a PR is
                // current. Merge conflicts and permission issues also surface
                // here — warn (don't fail the run) so one stuck PR can't block
                // updating the rest.
                if (/up to date/i.test(msg)) {
                  core.info(`#${pr.number} already up to date.`);
                } else {
                  core.warning(`Could not update #${pr.number}: ${msg}`);
                }
              }
            }
