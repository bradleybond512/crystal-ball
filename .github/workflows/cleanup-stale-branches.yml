name: Cleanup stale AI agent branches

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — log what would be deleted/closed without taking action'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    name: Close stale PRs and delete merged branches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Close stale open PRs (no activity in 30 days)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const dryRun = '${{ inputs.dry_run }}' === 'true';
            const agentPrefixes = ['claude/', 'codex/', 'copilot/', 'feat/', 'fix/', 'ui/', 'chore/', 'perf/', 'docs/'];
            const cutoff = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000);

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            let closed = 0;
            for (const pr of prs) {
              const isAgentBranch = agentPrefixes.some(p => pr.head.ref.startsWith(p));
              if (!isAgentBranch) continue;

              const updatedAt = new Date(pr.updated_at);
              if (updatedAt < cutoff) {
                if (dryRun) {
                  console.log(`[DRY RUN] Would close stale PR #${pr.number}: ${pr.title} (branch: ${pr.head.ref}, last updated: ${pr.updated_at})`);
                } else {
                  await github.rest.pulls.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    state: 'closed'
                  });
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: `Auto-closed by cleanup workflow: no activity for 30+ days (last updated ${pr.updated_at}). Reopen if this work is still relevant.`
                  });
                  console.log(`Closed stale PR #${pr.number}: ${pr.title} (branch: ${pr.head.ref}, reason: 30+ days inactive)`);
                  closed++;
                }
              }
            }
            if (!dryRun) console.log(`Closed ${closed} stale PRs.`);

      - name: Delete merged remote branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const dryRun = '${{ inputs.dry_run }}' === 'true';
            // Deletion allowlist is intentionally narrower than the stale-PR list:
            // only AI-agent branches and dependabot branches are eligible for deletion.
            // Feature/fix/docs branches are not auto-deleted to prevent accidental loss.
            const deletionAllowlist = ['claude/', 'codex/', 'copilot/', 'dependabot/'];

            const { data: branches } = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            let deleted = 0;
            for (const branch of branches) {
              const isAllowed = deletionAllowlist.some(p => branch.name.startsWith(p));
              if (!isAllowed) continue;

              // Skip branches with open PRs
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head: `${context.repo.owner}:${branch.name}`,
                state: 'open'
              });
              if (prs.length > 0) continue;

              // Check if branch is fully merged into main
              try {
                await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: branch.name,
                  head: 'main'
                });
                // main is ahead of or equal to branch — it is merged
                if (dryRun) {
                  console.log(`[DRY RUN] Would delete merged branch: ${branch.name}`);
                } else {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `heads/${branch.name}`
                  });
                  console.log(`Deleted merged branch: ${branch.name} (reason: fully merged into main, no open PR)`);
                  deleted++;
                }
              } catch (e) {
                // Branch has commits not in main — keep it
                console.log(`Keeping unmerged branch: ${branch.name}`);
              }
            }
            if (!dryRun) console.log(`Deleted ${deleted} merged branches.`);

      - name: Report summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: branches } = await github.rest.repos.listBranches({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            const agentPrefixes = ['claude/', 'codex/', 'copilot/', 'feat/', 'fix/', 'ui/', 'chore/', 'perf/', 'docs/'];
            const remaining = branches.filter(b => agentPrefixes.some(p => b.name.startsWith(p)));
            console.log(`Remaining agent branches after cleanup: ${remaining.length}`);
            remaining.forEach(b => console.log(` - ${b.name}`));
