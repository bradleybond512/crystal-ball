name: ESLint

on:
  pull_request:
  merge_group:

# Least privilege (zizmor excessive-permissions): read-only by default;
# a job that needs more declares it itself.
permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:eslint-runner
      - run: npm run lint:ci
