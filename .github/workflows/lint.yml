name: Lint

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.sh'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.css'
      - '.husky/**'
      - 'scripts/lint-*.mjs'
      - 'scripts/lint-colors-baseline.json'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'package-lock.json'
  merge_group:

jobs:
  static-lint:
    if: github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:conflicts
      - run: npm run lint:json
      - run: npm run lint:yaml
      - run: npm run lint:shell
      # Hardcoded-color ratchet — counts can only go down. Gates the whole
      # combined tree in the merge queue so the design-token debt can't grow.
      - run: npm run lint:colors
      - name: Lint changed markdown files
        # base_ref is empty in a merge_group event; the static lints above
        # already cover the combined tree, so skip the PR-diff markdown pass.
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.md' > "$RUNNER_TEMP/markdown-files.list"
          if [ ! -s "$RUNNER_TEMP/markdown-files.list" ]; then
            echo "No markdown files changed"
            exit 0
          fi
          tr '\n' '\0' < "$RUNNER_TEMP/markdown-files.list" > "$RUNNER_TEMP/markdown-files.txt"
          xargs -0 npx markdownlint-cli2 < "$RUNNER_TEMP/markdown-files.txt"
