name: Lint

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.json'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.sh'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.css'
      - '.husky/**'
      - 'scripts/lint-*.mjs'
      - 'scripts/lint-colors-baseline.json'
      - 'package.json'
      - 'package-lock.json'
  merge_group:

jobs:
  static-lint:
    if: github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint:conflicts
      - run: npm run lint:json
      - run: npm run lint:yaml
      - run: npm run lint:shell
      # Hardcoded-color ratchet — counts can only go down. Gates the whole
      # combined tree in the merge queue so the design-token debt can't grow.
      - run: npm run lint:colors
      - name: Lint repository markdown
        if: github.event_name == 'merge_group'
        run: npm run lint:md
      - name: Lint changed markdown files
        # base_ref is empty in a merge_group event, where the full-tree pass
        # above validates the combined result instead.
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref }}...HEAD" -- '*.md' > "$RUNNER_TEMP/markdown-files.list"
          if [ ! -s "$RUNNER_TEMP/markdown-files.list" ]; then
            echo "No markdown files changed"
            exit 0
          fi
          tr '\n' '\0' < "$RUNNER_TEMP/markdown-files.list" > "$RUNNER_TEMP/markdown-files.txt"
          xargs -0 node scripts/lint-markdown.mjs < "$RUNNER_TEMP/markdown-files.txt"
