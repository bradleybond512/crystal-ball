name: Release Integrity

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  integrity-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Check version consistency
        run: node scripts/sync-desktop-version.mjs --check

      - name: Check package lock integrity
        run: node scripts/check-package-lock.mjs

      - name: Check sidecar bundle completeness
        run: node scripts/check-sidecar-bundle.mjs

  scenario-coverage:
    # Plan: docs/CLAUDE_POST_PR197_INTEGRATION_HANDOFF_2026-04-28.md item 6.
    # Fails when scenario fixtures lose a mission domain or drop below floor.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run scenarios:check

  release-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      # PRs use --allow-existing-target-release so unrelated work doesn't
      # break when the main-branch tag has already been consumed. Main pushes
      # use the strict mode per variant so a stale version can't silently land.

      - name: Run release doctor for full variant on pull requests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-doctor.mjs --allow-existing-target-release --variant full

      - name: Run release doctor for tech variant on pull requests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-doctor.mjs --allow-existing-target-release --variant tech

      - name: Run release doctor for finance variant on pull requests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-doctor.mjs --allow-existing-target-release --variant finance

      - name: Run release doctor for full variant on main push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-doctor.mjs --variant full

      - name: Run release doctor for tech variant on main push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-doctor.mjs --variant tech

      - name: Run release doctor for finance variant on main push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-doctor.mjs --variant finance
