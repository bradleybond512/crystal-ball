name: SAST (Semgrep)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Semgrep (TypeScript + secrets rules)
        # Pinned to an immutable commit SHA (the @v1 tag is mutable and the
        # action repo is archived). SAST rules still come from the live
        # `config:` registry below, so pinning doesn't stale the ruleset.
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/typescript
            p/secrets
          auditOn: info
