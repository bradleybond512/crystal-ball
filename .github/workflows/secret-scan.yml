name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

# Least privilege (zizmor excessive-permissions): read-only by default;
# a job that needs more declares it itself.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: node scripts/secret-scan.mjs
