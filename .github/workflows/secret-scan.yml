name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
      - run: node scripts/secret-scan.mjs
