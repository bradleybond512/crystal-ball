name: Security Audit

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Audit all npm lockfiles
        id: advisories
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          ROLLOUT_BASE: 180f58ed0e15c6453afdc5b5a267fe1af38a7793
          ROLLOUT_SHA256: '040897891d33714a64fa6def48bfabf0b5944f8585c59b2fd27c21d4c42240bd'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          case "$GITHUB_EVENT_NAME" in
            pull_request) policy="$PR_BASE_SHA" ;;
            merge_group) policy="$MERGE_BASE_SHA" ;;
            push) [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1; policy="$GITHUB_SHA" ;;
            *) exit 1 ;;
          esac
          [[ "$policy" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git cat-file -e "$policy^{commit}"

          checker=scripts/audit-npm-locks.mjs
          source="$policy"
          # The initial base predates this checker. Only the reviewed bytes may
          # bootstrap it; any later base must supply its own evaluator.
          if [[ "$policy" == "$ROLLOUT_BASE" ]]; then source="$GITHUB_SHA"; fi
          mode=$(git ls-tree "$source" -- "$checker" | cut -d' ' -f1)
          [[ "$mode" == 100644 || "$mode" == 100755 ]] || exit 1
          scratch=$(mktemp -d "$RUNNER_TEMP/ux054.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          runner="$scratch/audit-npm-locks.mjs"
          git cat-file blob "$source:$checker" > "$runner"
          if [[ "$policy" == "$ROLLOUT_BASE" ]]; then
            [[ "$(sha256sum < "$runner" | cut -d' ' -f1)" == "$ROLLOUT_SHA256" ]] || exit 1
          fi
          env -i PATH="$(dirname "$(command -v node)"):/usr/bin:/bin" node "$runner"
      # Keep the existing root signature check on its trusted events. Forks
      # only submit lockfile blobs to the advisory scan above.
      - run: npm ci --ignore-scripts
        id: root_install
        if: >-
          !cancelled() && (steps.advisories.outcome == 'success' || steps.advisories.outcome == 'failure') &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      - name: npm audit signatures
        if: >-
          !cancelled() && steps.root_install.outcome == 'success' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: npm audit signatures

  cargo-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
        with:
          workspaces: src-tauri
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  cargo-deny:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
        with:
          workspaces: src-tauri
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # Supply-chain source + duplicate-version policy (src-tauri/deny.toml).
      # Advisories stay with the cargo-audit job above (single ignore list).
      - name: cargo deny (sources + bans)
        working-directory: src-tauri
        run: cargo deny check sources bans

  sidecar-http-guardrail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: No plain-HTTP external URLs in sidecar
        run: |
          # Flag plain-HTTP only when it targets a real external host (dotted TLD).
          # This shape requirement already drops loopback IPs (digit after the final
          # dot), `ws://`->`http://` scheme transforms, and `http://x` URL-parse
          # bases (no TLD). XML namespace identifiers, comments, and test/spec
          # fixtures are excluded explicitly. `|| true` keeps the step alive under
          # bash -eo pipefail when grep finds nothing.
          matches="$(grep -rnE "http://[a-zA-Z0-9.-]+\.[a-zA-Z]" src-tauri/sidecar/ \
              | grep -v "127\.0\.0\.1\|localhost\|xmlns\|#\|\.test\.\|spec\." || true)"
          if [ -n "$matches" ]; then
            echo "ERROR: Plain HTTP external URL found in sidecar. Use HTTPS." >&2
            echo "$matches" >&2
            exit 1
          fi
          echo "OK: No plain-HTTP external URLs in sidecar."
