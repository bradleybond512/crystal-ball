name: Smoke

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run smoke:offline
      # Full renderer unit-test sweep. Globs EVERY src/**/__tests__ dir (depths
      # 2-4) so the ~100 test:* suites that previously ran in NO CI workflow —
      # including the safety-critical weather / notification / seismic / provider
      # suites and the hardcoded-list test:intelligence that silently skipped
      # ~half its own files — now gate every PR and can't silently rot (audit
      # 2026-06). Single-* globs (no globstar) so it's portable across the
      # CI shell + Node version.
      - run: npm run test:renderer
      # Swallowed-click ("dead click") delegation regression guards for the
      # Panel-subclass / import.meta.glob components (GlobeHUD, NewsPanel,
      # CIIPanel, SituationPanel). They load the register-hook stub loader, so
      # test:renderer's plain-tsx src/** glob can't run them; the three
      # standalone-overlay guards (TodayView / ReasoningDebugOverlay /
      # OfflineStalenessBanner) import clean and ARE covered by test:renderer.
      - run: npm run test:delegation
      # Cloud API routes and the complete localhost-sidecar contract are
      # separate Node suites; renderer globs cannot discover either tree.
      - run: npm run test:api
      - run: npm run test:sidecar
      - run: npm run build
      - run: npm run pwa:budget
      # PR 16 cognition CI gate: replays the frozen golden-window corpus
      # through the deterministic cognition pipeline and fails on Brier
      # regression / conformal coverage drop versus the committed baseline
      # (src/services/cognition/bench-baseline.json). Fully offline,
      # fixed-seed fixtures, no LLM calls — single-digit-millisecond runtime,
      # cannot hang or become a slow step.
      - run: npm run bench:cognition
      # Full MCP server suite (path-traversal sandbox, watchlist/alert tools,
      # trend/anomaly/correlate, sidecar client, etc.). It's a separate package
      # with its own deps (zod), so install + run it on its own — previously it
      # ran in NO CI workflow and had silently rotted (a stale time-bomb trend
      # test). Subsumes the earlier root-deps test:mcp-storage step.
      - run: cd tools/mcp-server && npm ci && npm test
      # Sidecar security-hardening suite (SSRF IP classification + pinning, CSP
      # allowlist, webhook dispatch, IPv4 redirect) — the Node sidecar tests live
      # under src-tauri/ so test:renderer can't reach them; this gates them.
      - run: npm run test:sec-hardening
