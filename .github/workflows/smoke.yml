name: Smoke

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run smoke:offline
      - run: npm run test:replay
      # Unit suites that were previously CI-ungated and silently rotted
      # (orphaned tests, audit 2026-06). test:algorithms globs the whole
      # algorithms dir so new files can't slip past CI again.
      - run: npm run test:algorithms
      - run: npm run test:intelligence
      # test:diagnostics globs the whole diagnostics dir so the privacy-canary
      # gate (and other diagnostics tests) run in CI and can't silently rot.
      - run: npm run test:diagnostics
