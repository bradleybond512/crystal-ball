name: Smoke

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run smoke:offline
      # Full renderer unit-test sweep. Globs EVERY src/**/__tests__ dir (depths
      # 2-4) so the ~100 test:* suites that previously ran in NO CI workflow —
      # including the safety-critical weather / notification / seismic / provider
      # suites and the hardcoded-list test:intelligence that silently skipped
      # ~half its own files — now gate every PR and can't silently rot (audit
      # 2026-06). Single-* globs (no globstar) so it's portable across the
      # CI shell + Node version.
      - run: npm run test:renderer
      # Swallowed-click ("dead click") delegation regression guards for the
      # Panel-subclass / import.meta.glob components (GlobeHUD, NewsPanel,
      # CIIPanel, SituationPanel). They load the register-hook stub loader, so
      # test:renderer's plain-tsx src/** glob can't run them; the three
      # standalone-overlay guards (TodayView / ReasoningDebugOverlay /
      # OfflineStalenessBanner) import clean and ARE covered by test:renderer.
      - run: npm run test:delegation
      # Cloud API routes and the complete localhost-sidecar contract are
      # separate Node suites; renderer globs cannot discover either tree.
      - run: npm run test:api
      - run: npm run test:sidecar
      - run: npm run build
      - run: npm run pwa:budget
      # PR 16 cognition CI gate: replays the frozen golden-window corpus
      # through the deterministic cognition pipeline and fails on Brier
      # regression / conformal coverage drop versus the committed baseline
      # (src/services/cognition/bench-baseline.json). Fully offline,
      # fixed-seed fixtures, no LLM calls — single-digit-millisecond runtime,
      # cannot hang or become a slow step.
      - run: npm run bench:cognition
      # Frozen, privacy-safe forecast/outcome metadata replayed with expanding
      # time windows. Fails on Brier-skill/log-loss/coverage/high-confidence
      # miss regressions versus the reviewed baseline.
      - run: npm run bench:forecast
      - run: npm run bench:baselines
      # ACC-501 correlation CI gate: replays the frozen golden-stream corpus
      # through the REAL lead-lag miner and a REAL CorrelateEngine carrying the
      # shipped built-in rules, and fails on coupling/pair precision-recall
      # regression, near-miss decoy leakage, or learned-rule blast-radius growth
      # versus the committed baseline
      # (src/services/correlation/__bench__/bench-correlation-baseline.json).
      # Tolerances are one-sided, but the committed `reportDigest` pins the
      # whole report: any change that moves any reported number — including an
      # ACC-502..506 improvement — fails on identity and must be re-seeded with
      # `npm run bench:correlation -- --seed` into a temporary candidate file.
      # When a PR or merge queue entry changes the tracked baseline, the step
      # below extracts the BASE branch baseline and requires the candidate to
      # pass its one-sided gates before the normal exact-identity gate runs.
      # Fully offline, frozen fixtures, injected timer + fixed `now` — sub-second
      # runtime, cannot hang or become a slow step.
      - name: Guard correlation baseline reseed against base branch
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          BASELINE_PATH=src/services/correlation/__bench__/bench-correlation-baseline.json
          if git diff --quiet "$BASE_SHA" -- "$BASELINE_PATH"; then
            exit 0
          fi
          PREVIOUS_BASELINE="$RUNNER_TEMP/bench-correlation-baseline.previous.json"
          git show "$BASE_SHA:$BASELINE_PATH" > "$PREVIOUS_BASELINE"
          npm run bench:correlation -- --seed --previous-baseline "$PREVIOUS_BASELINE" \
            > "$RUNNER_TEMP/bench-correlation-baseline.candidate.json"
      - run: npm run bench:correlation
      # Full MCP server suite (path-traversal sandbox, watchlist/alert tools,
      # trend/anomaly/correlate, sidecar client, etc.). It's a separate package
      # with its own deps (zod), so install + run it on its own — previously it
      # ran in NO CI workflow and had silently rotted (a stale time-bomb trend
      # test). Subsumes the earlier root-deps test:mcp-storage step.
      - run: cd tools/mcp-server && npm ci && npm test
      # Sidecar security-hardening suite (SSRF IP classification + pinning, CSP
      # allowlist, webhook dispatch, IPv4 redirect) — the Node sidecar tests live
      # under src-tauri/ so test:renderer can't reach them; this gates them.
      - run: npm run test:sec-hardening
