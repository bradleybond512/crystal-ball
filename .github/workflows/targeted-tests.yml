name: Targeted tests

# Changed-path-scoped unit tests as a merge gate. Branch protection's other
# required checks run zero unit tests; the full sweep is too slow per-PR.
# scripts/targeted-tests.mjs derives the mapping from package.json itself
# (each test:* script lists its files; src/<area>/__tests__/ covers
# src/<area>/) and runs everything the diff touches — no cap. Docs-only and
# dependency-only PRs select nothing and pass after npm ci.
#
# The selector is executed FROM origin/main, never from the PR head: a PR
# must not control which tests judge it. (The test files themselves run from
# the PR tree — that is inherent to CI and true of every check here.)
#
# Runs on fork PRs too: it needs no secrets, and a skipped job would satisfy
# a required check vacuously.
on:
  pull_request:
    branches:
      - main
  merge_group:

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: '1.93.1'
      - name: Rust cache
        uses: swatinem/rust-cache@ad397744b0d591a723ab90405b7247fac0e6b8db
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true
      - name: Install Tauri Linux compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev
      - run: npm ci
      # test:diagnostics reaches into tools/mcp-server/__tests__, whose imports
      # resolve against that package's own node_modules. Without this the suite
      # dies on ERR_MODULE_NOT_FOUND for zod on every PR touching
      # src/services/diagnostics. smoke.yml already installs it the same way.
      # (--prefix would read the root package name off the directory name and
      # fail the lockfile-sync check, so run it from inside the package.)
      - run: npm ci
        working-directory: tools/mcp-server
      - name: Select and run targeted suites
        run: |
          git fetch origin main --quiet
          if git cat-file -e origin/main:scripts/targeted-tests.mjs 2>/dev/null; then
            git show origin/main:scripts/targeted-tests.mjs > "$RUNNER_TEMP/targeted-tests.mjs"
            node "$RUNNER_TEMP/targeted-tests.mjs" --ci
          else
            echo "targeted-tests.mjs not on origin/main yet (gate rollout); passing."
          fi
