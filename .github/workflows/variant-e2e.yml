name: Variant E2E

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  identity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # ubuntu-latest is Ubuntu 26.04. Playwright 1.59.1 has no ubuntu26.04
    # browser dependency map (install --with-deps exits 1). 24.04 is the image
    # 1.59.1 supports; test-linux-app.yml already pins it. Do not float back to
    # ubuntu-latest until the installed Playwright release lists ubuntu26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - full
          - tech
          - finance
          - happy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/variant-identity.spec.ts
        env:
          VITE_VARIANT: ${{ matrix.variant }}
      # test:e2e:runtime is intentionally not here. Draft PR #1816 owns map,
      # interaction, and Home browser coverage on the smoke workflow and does
      # not run runtime-fetch. On current main the suite fails (6 cases): local
      # calls are not recorded, and /api/local-env-update throws "Local API
      # port not confirmed" after the confirmed-port sidecar change. Adding the
      # red suite would not make CI green. Do not schedule it until those
      # assertions match the confirmed-port runtime.
