name: Variant E2E

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  identity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # ubuntu-latest is Ubuntu 26.04. Playwright 1.59.1 has no ubuntu26.04
    # browser dependency map (install --with-deps exits 1). 24.04 is the image
    # 1.59.1 supports; test-linux-app.yml already pins it. Do not float back to
    # ubuntu-latest until the installed Playwright release lists ubuntu26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - full
          - tech
          - finance
          - happy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/variant-identity.spec.ts
        env:
          VITE_VARIANT: ${{ matrix.variant }}
      # runtime-fetch is not in draft PR #1816. That PR owns map, interaction,
      # and Home browser coverage on the smoke workflow. This step stays on the
      # full leg only so the two PRs do not schedule the same specs.
      - name: Runtime fetch guardrails
        if: matrix.variant == 'full'
        run: npm run test:e2e:runtime
