[package]
name = "crystalball"
version = "2.25.147"
description = "Crystal Ball cross-platform desktop application "
authors = ["Bradley Bond", ""]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
sha2 = "0.11"
getrandom = "0.4"
tauri-plugin-biometry = "0.2.8"
tauri-plugin-clipboard-manager = "2"
aes-gcm = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.7"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
